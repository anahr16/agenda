<h1>Clientes</h1>

<form class="form-cliente" (ngSubmit)="guardar()">
  <input type="text" name="nombre" placeholder="Nombre" [(ngModel)]="nombre" required />
  <input type="text" name="telefono" placeholder="Telefono (opcional)" [(ngModel)]="telefono" />
  <button type="submit">{{ editandoId() ? 'Guardar cambios' : 'Agregar cliente' }}</button>
  @if (editandoId()) {
    <button type="button" class="secundario" (click)="cancelarEdicion()">Cancelar</button>
  }
</form>

@if (error()) {
  <p class="mensaje">{{ error() }}</p>
}

<table class="tabla">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Telefono</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (cliente of clientes(); track cliente.id) {
      <tr>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.telefono || '-' }}</td>
        <td class="acciones">
          <button type="button" class="secundario" (click)="editar(cliente)">Editar</button>
          <button type="button" class="secundario" (click)="borrar(cliente)">Borrar</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">Todavia no hay clientes.</td>
      </tr>
    }
  </tbody>
</table>
