<div class="app-shell">
  <div class="blob" style="width:24rem;height:24rem;background:var(--accent-purple);top:-6rem;left:10rem;opacity:0.18;"></div>
  <div class="blob" style="width:20rem;height:20rem;background:var(--accent-pink);bottom:-5rem;right:8rem;opacity:0.16;"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="dot"><img src="/img/logo.png" alt="Anadesing" /></span>
      <span class="word display">Agenda Inteligente</span>
    </div>

    <nav class="nav-group">
      <a routerLink="/agenda" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Agenda
      </a>
      <a routerLink="/postulaciones" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Postulaciones
      </a>
    </nav>

    @if (proximasEntrevistas().length > 0) {
      <div class="sidebar-section-label">Próximas entrevistas</div>
      @for (pe of proximasEntrevistas(); track pe.id) {
        <a routerLink="/agenda" class="sidebar-entrevista">
          <span class="pip"></span>
          <span class="txt">
            <span class="empresa">{{ pe.empresa }}</span>
            <span class="cuando">{{ pe.cuando }}</span>
          </span>
        </a>
      }
    }

    <div class="sidebar-spacer"></div>

    @if (pushDisponible) {
      <button type="button" class="push-btn" (click)="activarRecordatorios()">Activar recordatorios</button>
    }
    @if (mensajePush()) {
      <p class="aviso-push">{{ mensajePush() }}</p>
    }

    <div class="user-card">
      <div class="user-avatar">{{ inicial }}</div>
      <div class="user-info">
        <div class="user-name">{{ email }}</div>
      </div>
      <button type="button" class="logout-btn" (click)="salir()" title="Salir">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
